<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI StudyPort - Academic Profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    background:
      linear-gradient(90deg, rgba(6,10,20,0.55) 0%, rgba(6,10,20,0.15) 42%, rgba(6,10,20,0.05) 60%),
      url('/images/minhati.jpg') center/cover no-repeat;
  }

  /* Hidden until we've confirmed the token is valid, so a logged-out
     visitor never sees a flash of profile content (same guard as dashboard). */
  #appShell{ display:none; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.25rem 2rem;
    background:rgba(13,20,38,0.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:0.55rem;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    color:#fff;
  }
  .brand .mark{
    width:26px; height:26px;
    border-radius:8px;
    background:linear-gradient(135deg, #38DFEA, #4F8CFF);
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; font-weight:700; color:#0B1220;
  }

  .top-actions{
    display:flex;
    align-items:center;
    gap:0.75rem;
  }

  .link-btn{
    padding:0.55rem 1.1rem;
    background:transparent;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    color:#fff;
    text-decoration:none;
    font-size:0.85rem;
    font-weight:600;
    transition:background .15s;
  }
  .link-btn:hover{ background:rgba(255,255,255,0.1); }

  .logout-btn{
    padding:0.55rem 1.1rem;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    color:#fff;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  .logout-btn:hover{ background:rgba(255,255,255,0.16); }

  main{
    max-width:640px;
    margin:3rem auto;
    padding:0 2rem;
  }

  .card{
    background:rgba(13,20,38,0.68);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:20px;
    padding:2.25rem 2rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    color:#fff;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.6rem;
    margin-bottom:0.5rem;
  }

  .sub{
    color:rgba(255,255,255,0.65);
    font-size:0.9rem;
    margin-bottom:1.75rem;
  }

  form{ display:flex; flex-direction:column; gap:1.15rem; }

  .field{ display:flex; flex-direction:column; gap:0.4rem; }

  label{
    font-size:0.85rem;
    font-weight:600;
    color:rgba(255,255,255,0.85);
  }

  input, select, textarea{
    width:100%;
    padding:0.75rem 0.9rem;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:10px;
    color:#fff;
    font-family:inherit;
    font-size:0.92rem;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  input::placeholder, textarea::placeholder{ color:rgba(255,255,255,0.35); }
  input:focus, select:focus, textarea:focus{
    border-color:#38DFEA;
    background:rgba(255,255,255,0.1);
  }
  input.invalid, select.invalid, textarea.invalid{
    border-color:#FF6B6B;
  }
  textarea{ resize:vertical; min-height:90px; }

  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 0.85rem center;
    background-size:16px;
  }
  select option{ background:#0D1426; color:#fff; }

  .error-text{
    font-size:0.78rem;
    color:#FF9B9B;
    min-height:1em;
  }

  .save-btn{
    margin-top:0.5rem;
    padding:0.85rem;
    background:linear-gradient(135deg, #38DFEA, #4F8CFF);
    border:none;
    border-radius:10px;
    color:#0B1220;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s, transform .15s;
  }
  .save-btn:hover{ opacity:0.92; }
  .save-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .status-banner{
    display:none;
    padding:0.75rem 1rem;
    border-radius:10px;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:1.25rem;
  }
  .status-banner.success{
    display:block;
    background:rgba(56,223,148,0.12);
    border:1px solid rgba(56,223,148,0.4);
    color:#6EE7A8;
  }
  .status-banner.error{
    display:block;
    background:rgba(255,107,107,0.12);
    border:1px solid rgba(255,107,107,0.4);
    color:#FF9B9B;
  }

  .loading-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    color:#fff;
    font-size:0.9rem;
    opacity:0.7;
  }
</style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">Loading...</div>

  <div id="appShell">
    <div class="topbar">
      <div class="brand">
        <span class="mark">A</span>
        AI StudyPort
      </div>
      <div class="top-actions">
        <a class="link-btn" href="dashboard.html">Back to Dashboard</a>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </div>

    <main>
      <div class="card">
        <h1>Academic Profile</h1>
        <p class="sub">Keep your study details up to date so we can personalize your experience.</p>

        <div class="status-banner" id="statusBanner"></div>

        <form id="profileForm" novalidate>
          <div class="field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. Sara Ahmad" autocomplete="name">
            <div class="error-text" id="fullNameError"></div>
          </div>

          <div class="field">
            <label for="institution">University / Institution</label>
            <input type="text" id="institution" name="institution" placeholder="e.g. Islamic University of Gaza">
            <div class="error-text" id="institutionError"></div>
          </div>

          <div class="field">
            <label for="major">Major / Field of Study</label>
            <input type="text" id="major" name="major" placeholder="e.g. Computer Engineering">
            <div class="error-text" id="majorError"></div>
          </div>

          <div class="field">
            <label for="academicYear">Academic Year</label>
            <select id="academicYear" name="academicYear">
              <option value="">Select year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
              <option value="5+">5th Year or above</option>
              <option value="graduate">Graduate Student</option>
            </select>
            <div class="error-text" id="academicYearError"></div>
          </div>

          <div class="field">
            <label for="bio">Short Bio (optional)</label>
            <textarea id="bio" name="bio" placeholder="A few sentences about your study goals or interests" maxlength="300"></textarea>
            <div class="error-text" id="bioError"></div>
          </div>

          <button type="submit" class="save-btn" id="saveBtn">Save Profile</button>
        </form>
      </div>
    </main>
  </div>

<script>
  const API_BASE_URL = 'http://127.0.0.1:8000/api';

  const form = document.getElementById('profileForm');
  const saveBtn = document.getElementById('saveBtn');
  const statusBanner = document.getElementById('statusBanner');

  const fields = {
    fullName: document.getElementById('fullName'),
    institution: document.getElementById('institution'),
    major: document.getElementById('major'),
    academicYear: document.getElementById('academicYear'),
    bio: document.getElementById('bio')
  };
  const errors = {
    fullName: document.getElementById('fullNameError'),
    institution: document.getElementById('institutionError'),
    major: document.getElementById('majorError'),
    academicYear: document.getElementById('academicYearError'),
    bio: document.getElementById('bioError')
  };

  function goToLogin() {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('auth_user');
    window.location.replace('login.html');
  }

  function clearErrors() {
    Object.values(errors).forEach(el => el.textContent = '');
    Object.values(fields).forEach(el => el.classList.remove('invalid'));
  }

  function showBanner(message, type) {
    statusBanner.textContent = message;
    statusBanner.className = 'status-banner ' + type;
  }

  function validate() {
    clearErrors();
    let valid = true;

    if (!fields.fullName.value.trim()) {
      errors.fullName.textContent = 'Full name is required.';
      fields.fullName.classList.add('invalid');
      valid = false;
    }
    if (!fields.institution.value.trim()) {
      errors.institution.textContent = 'Institution is required.';
      fields.institution.classList.add('invalid');
      valid = false;
    }
    if (!fields.major.value.trim()) {
      errors.major.textContent = 'Major is required.';
      fields.major.classList.add('invalid');
      valid = false;
    }
    if (!fields.academicYear.value) {
      errors.academicYear.textContent = 'Please select your academic year.';
      fields.academicYear.classList.add('invalid');
      valid = false;
    }
    if (fields.bio.value.length > 300) {
      errors.bio.textContent = 'Bio must be 300 characters or fewer.';
      fields.bio.classList.add('invalid');
      valid = false;
    }

    return valid;
  }

  async function loadProfile() {
    const token = localStorage.getItem('auth_token');

    if (!token) {
      goToLogin();
      return;
    }

    try {
      // Confirm the token is still valid before showing anything,
      // same guard used on the dashboard page.
      const meResponse = await fetch(`${API_BASE_URL}/me`, {
        headers: {
          'Accept': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      });

      if (!meResponse.ok) {
        goToLogin();
        return;
      }

      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';

      // Load any existing profile data to pre-fill the form (edit mode).
      const profileResponse = await fetch(`${API_BASE_URL}/profile`, {
        headers: {
          'Accept': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      });

      if (profileResponse.ok) {
        const profile = await profileResponse.json();
        if (profile) {
          fields.fullName.value = profile.full_name || '';
          fields.institution.value = profile.institution || '';
          fields.major.value = profile.major || '';
          fields.academicYear.value = profile.academic_year || '';
          fields.bio.value = profile.bio || '';
        }
      }
      // A 404 here just means no profile exists yet — the form stays
      // empty and the first save will create one.
    } catch (error) {
      goToLogin();
    }
  }

  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    statusBanner.className = 'status-banner';

    if (!validate()) return;

    const token = localStorage.getItem('auth_token');
    if (!token) {
      goToLogin();
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      const response = await fetch(`${API_BASE_URL}/profile`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          full_name: fields.fullName.value.trim(),
          institution: fields.institution.value.trim(),
          major: fields.major.value.trim(),
          academic_year: fields.academicYear.value,
          bio: fields.bio.value.trim()
        })
      });

      if (response.status === 401) {
        goToLogin();
        return;
      }

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        showBanner(data.message || 'Could not save your profile. Please try again.', 'error');
        return;
      }

      showBanner('Profile saved successfully.', 'success');
    } catch (error) {
      showBanner('Network error — please check your connection and try again.', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Profile';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async function() {
    const btn = this;
    const token = localStorage.getItem('auth_token');

    btn.disabled = true;
    btn.textContent = 'Logging out...';

    try {
      if (token) {
        await fetch(`${API_BASE_URL}/logout`, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });
      }
    } catch (error) {
      // Still clear local state below even if the request fails.
    } finally {
      goToLogin();
    }
  });

  // Same bfcache guard as the dashboard: re-check the token every time
  // this page becomes visible (including via the browser back button).
  window.addEventListener('pageshow', function() {
    loadProfile();
  });
</script>

</body>
</html>
